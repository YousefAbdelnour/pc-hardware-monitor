<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting PC Hardware Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-top: #06111a;
        --bg-bottom: #0b1622;
        --panel: rgba(10, 21, 31, 0.9);
        --panel-border: rgba(103, 240, 255, 0.18);
        --text: rgba(245, 250, 255, 0.96);
        --muted: rgba(216, 230, 242, 0.7);
        --accent: #49e6ff;
        --accent-soft: #85ffd6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI Variable Display", Bahnschrift, "Trebuchet MS", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 16% 16%, rgba(73, 230, 255, 0.22), transparent 26%),
          radial-gradient(circle at 82% 84%, rgba(133, 255, 214, 0.18), transparent 24%),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        background-size: auto, auto, 36px 36px, 36px 36px, auto;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 12px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        position: relative;
        width: min(100%, 460px);
        padding: 32px 34px 30px;
        border-radius: 28px;
        border: 1px solid var(--panel-border);
        background: linear-gradient(180deg, rgba(12, 23, 35, 0.96), var(--panel));
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.38),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 0 46px rgba(73, 230, 255, 0.15);
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: -80px 10% auto;
        height: 180px;
        background: radial-gradient(circle, rgba(73, 230, 255, 0.14), transparent 70%);
        filter: blur(18px);
      }

      .mark-shell {
        position: relative;
        width: 136px;
        height: 136px;
        margin: 0 auto 18px;
      }

      .ring,
      .ring::before {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .ring {
        border: 1px solid rgba(73, 230, 255, 0.16);
        animation: rotate 12s linear infinite;
      }

      .ring::before {
        content: "";
        inset: 12px;
        border: 1px solid rgba(133, 255, 214, 0.14);
        animation: rotateReverse 9s linear infinite;
      }

      .brand-mark {
        position: absolute;
        inset: 14px;
        width: calc(100% - 28px);
        height: calc(100% - 28px);
        object-fit: contain;
        filter: drop-shadow(0 16px 32px rgba(63, 219, 255, 0.18));
        animation: breathe 2.8s ease-in-out infinite;
      }

      .eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.34em;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 34px;
        line-height: 1.04;
        text-align: center;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 auto;
        max-width: 320px;
        font-size: 14px;
        line-height: 1.7;
        text-align: center;
        color: var(--muted);
      }

      .loader {
        margin-top: 26px;
      }

      .loader-track {
        position: relative;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .loader-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-soft));
        box-shadow: 0 0 28px rgba(73, 230, 255, 0.35);
        animation: sweep 1.6s ease-in-out infinite;
      }

      .loader-labels {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-top: 12px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.52);
      }

      .loader-labels span:last-child {
        color: rgba(255, 255, 255, 0.76);
      }

      @keyframes sweep {
        0% {
          left: -18%;
        }

        50% {
          left: 42%;
        }

        100% {
          left: 82%;
        }
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes rotateReverse {
        from {
          transform: rotate(360deg);
        }

        to {
          transform: rotate(0deg);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: translateY(0) scale(0.985);
        }

        50% {
          transform: translateY(-3px) scale(1.015);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="panel" aria-label="Application startup">
        <div class="mark-shell">
          <div class="ring"></div>
          <img class="brand-mark" src="./brand-mark.png" alt="PC Hardware Monitor" />
        </div>
        <div class="eyebrow">PC Hardware Monitor</div>
        <h1>Starting live telemetry</h1>
        <p>Warming up the sensor reader, local backend, tray services, and the realtime stream.</p>
        <div class="loader" aria-hidden="true">
          <div class="loader-track">
            <div class="loader-fill"></div>
          </div>
          <div class="loader-labels">
            <span>Loading</span>
            <span>Please wait</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
